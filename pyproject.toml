[build-system]
# 77 is where PEP 639 lands -- `license` as an SPDX string and `license-files`
# as a field rather than a classifier, which is what PyPI reads now.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-brainrot"
version = "0.3.0"
description = "Subway Surfers while Claude Code is thinking: a generated 3D gameplay strip beside your terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "claude-code", "overlay", "raylib", "procedural-generation",
    "parkour", "brainrot", "gamedev", "hooks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Utilities",
]
dependencies = [
    # GPU renderer and overlay window. ~2 MB wheel, no transitive deps.
    "raylib>=6.0",
    # Procedural texture generation at scene construction, and PNG output for
    # `brainrot shoot`. Never on the per-frame path.
    "pillow>=10.0",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest>=8.0"]
# Rebuilding the committed .glb assets from their Blender scripts. Heavy
# (Blender as a pip module); only needed when editing files in assets/src/.
assets = ["bpy>=4.2"]

[project.urls]
Homepage = "https://github.com/tristanmuzzu/claude-brainrot"
Repository = "https://github.com/tristanmuzzu/claude-brainrot"
Issues = "https://github.com/tristanmuzzu/claude-brainrot/issues"
Changelog = "https://github.com/tristanmuzzu/claude-brainrot/releases"

[project.scripts]
brainrot = "brainrot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# metrics.json is not documentation: it is the measured geometry of the kit,
# and the gameplay reads it at import. Leaving it out builds a wheel that
# installs cleanly and raises FileNotFoundError on the first command, which an
# editable install can never show you because it reads the source tree.
"brainrot.assets" = ["data/*.glb", "data/*.png", "data/*.json"]
# The gnome-shell extension ships inside the wheel and is copied into place by
# `brainrot install`; it is what tells the daemon which window is in front on
# a Wayland session.
"brainrot" = [
    "extension/*/metadata.json",
    "extension/*/*.js",
    "extension/*/schemas/*.xml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Headless rendering needs the SDL dummy driver and the software rasteriser;
# tests/conftest.py sets both up before raylib is imported.
